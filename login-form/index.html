<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <form id="form">
        <h1 id="title">Register With Us</h1>

        <div class="box">
          <label for="username">Username</label>
          <input
            name="username"
            id="username"
            type="text"
            placeholder="Enter username"
          />
          <span class="error-message">Invalid username</span>
        </div>

        <div class="box">
          <label for="email">Email</label>
          <input
            name="email"
            id="email"
            type="email"
            placeholder="Enter email"
          />
          <span class="error-message">Invalid email</span>
        </div>

        <div class="box">
          <label for="password">Password</label>
          <input
            name="password"
            id="password"
            type="password"
            placeholder="Enter password"
          />
          <span class="error-message">Invalid password</span>
        </div>

        <div class="box">
          <label for="password-conf">Confirm Password</label>
          <input
            name="password-conf"
            id="password-conf"
            type="text"
            placeholder="Enter password again"
          />
          <span class="error-message">Password doesn't match</span>
        </div>

        <div class="submit-btn">
          <input id="submit" type="submit" />
        </div>
      </form>
    </div>
  </body>
</html>
